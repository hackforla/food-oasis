name: Deploy main branch to foodoasis.herokuapp.com

# Manual only. Production is moving to the Hack for LA incubator (hackforla/devops#238), and a
# push to main now deploys there through deployToIncubator.yml instead. Until Heroku is
# retired (hackforla/devops#239), run this by hand to put main on Heroku production:
#   gh workflow run mainToHeroku.yml --ref main -R hackforla/food-oasis
on:
  workflow_dispatch:

jobs:
  build:
    # A manual run can name any branch; only main may reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - uses: akhileshns/heroku-deploy@v3.15.15 # This is the action
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "foodoasis" #Must be unique in Heroku
          heroku_email: "darragh@entrotech.net"
          usedocker: true
