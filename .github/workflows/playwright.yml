name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ./client
      run: npx playwright install --with-deps

    - name: Install wait-on
      working-directory: ./client
      run: npm install wait-on

    - name: Run Playwright tests
      working-directory: ./client
      run: |
        nproc && free -h
        npm run start &
        start=$(date +%s)
        npx wait-on http://localhost:3000
        echo "Dev server ready after $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
        npx playwright test
        free -h

    - name: Summarize Playwright timings
      if: ${{ !cancelled() }}
      working-directory: ./client
      run: |
        if [ -f playwright-report/results.json ]; then
          node scripts/playwright-timing-summary.mjs playwright-report/results.json >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No Playwright JSON report found." >> "$GITHUB_STEP_SUMMARY"
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: client/playwright-report/
        retention-days: 30
